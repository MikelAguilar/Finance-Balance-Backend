# Raíz del workspace: no es un paquete. Cada servicio vive en services/<nombre>/ y el código que
# comparten vive en libs/<nombre>/. Cada uno tiene su propio pyproject.toml, y todos comparten este
# uv.lock y las herramientas de desarrollo.
[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "httpx>=0.27,<1",
    "hypothesis>=6.170,<7",
    "mutmut>=3,<4",
    "pip-audit>=2.10,<3",
    "pylint>=4,<5",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1,<8",
    "pytest-randomly>=5.1,<6",
    "radon>=6,<7",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tools"]
# Las herramientas de tools/ se importan por su nombre (crap) desde sus pruebas.
pythonpath = ["tools"]
# Cada servicio tiene su carpeta tests/; importlib evita choques entre archivos con el mismo nombre.
# --strict-markers: un marcador mal escrito es un error, no una prueba que se salta en silencio.
addopts = "--import-mode=importlib --strict-markers"
markers = ["integration: necesita PostgreSQL real (variable TEST_DATABASE_URL)"]
# Toda advertencia hace fallar las pruebas, salvo la conocida de Starlette (deuda técnica registrada).
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["auth_service", "finance_service", "service_common"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.ruff.lint.isort]
known-first-party = ["auth_service", "finance_service", "service_common"]

# Mutación (job «mutacion» del CI; mutmut necesita fork, así que no corre en Windows).
[tool.mutmut]
source_paths = ["libs/common/src/", "services/auth/src/", "services/finance/src/"]
also_copy = [
    "conftest.py",
    "libs/common/tests/",
    "services/auth/alembic.ini",
    "services/auth/migrations/",
    "services/auth/tests/",
    "services/finance/tests/",
]
pytest_add_cli_args = ["-p", "no:randomly"]
