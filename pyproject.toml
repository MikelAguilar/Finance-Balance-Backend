# Raíz del workspace: no es un paquete. Cada servicio vive en services/<nombre>/ con su
# propio pyproject.toml, y todos comparten este uv.lock y las herramientas de desarrollo.
[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "httpx>=0.27,<1",
    "pip-audit>=2.10,<3",
    "pytest>=8,<9",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["services"]
# Cada servicio tiene su carpeta tests/; importlib evita choques entre archivos con el mismo nombre.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.ruff.lint.isort]
known-first-party = ["auth_service"]
