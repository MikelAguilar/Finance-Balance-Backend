[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-balance-finance"
version = "0.1.0"
description = "Servicio de finanzas de Finance Balance: tarjetas, movimientos, ingreso y sincronización"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
    "finance-balance-common",
]

[tool.uv.sources]
finance-balance-common = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
