[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-balance-finance"
version = "0.1.0"
description = "Servicio de finanzas de Finance Balance: tarjetas, movimientos, ingreso y sincronización"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.3.9,<4",
    "uvicorn>=0.32,<1",
    "finance-balance-common",
]

[tool.uv.sources]
finance-balance-common = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

# Mutación (job «mutacion» del CI, uno por paquete). mutmut corre desde esta carpeta: así el
# módulo que muta (src/...) tiene el mismo nombre con que lo importan las pruebas.
[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args = ["-p", "no:randomly"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["alembic.ini", "migrations/", "contract/"]
