[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-balance-auth"
version = "0.1.0"
description = "Servicio de autenticación de Finance Balance: cuentas, sesiones y dispositivos"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.4,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.15,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.3.9,<4",
    "uvicorn>=0.32,<1",
    "finance-balance-common",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
finance-balance-common = { workspace = true }

# Mutación (job «mutacion» del CI, uno por paquete). mutmut corre desde esta carpeta: así el
# módulo que muta (src/...) tiene el mismo nombre con que lo importan las pruebas.
[tool.mutmut]
source_paths = ["src/"]
also_copy = ["alembic.ini", "migrations/", "openapi.json"]
# ports.py solo declara interfaces (Protocol): su código nunca se ejecuta, así que cualquier
# mutante ahí es equivalente.
do_not_mutate = ["src/auth_service/application/ports.py"]
pytest_add_cli_args = ["-p", "no:randomly"]
pytest_add_cli_args_test_selection = ["tests/"]
