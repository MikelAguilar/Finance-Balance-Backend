[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-balance-auth"
version = "0.1.0"
description = "Servicio de autenticación de Finance Balance: cuentas, sesiones y dispositivos"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.4,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.15,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.3.9,<4",
    "uvicorn>=0.32,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
