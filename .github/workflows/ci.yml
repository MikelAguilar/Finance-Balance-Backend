name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Cada lunes revisa de nuevo las versiones fijadas: aparecen vulnerabilidades aunque nadie cambie código.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          HYPOTHESIS_PROFILE: ci
      # Código repetido (6 líneas o más) en el código fuente y las herramientas. Las pruebas quedan
      # fuera: repiten a propósito los valores esperados (son su oráculo).
      - name: Duplicación (pylint)
        run: uv run pylint --disable=all --enable=duplicate-code --min-similarity-lines=6 libs/*/src services/*/src tools/crap.py

  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial, no solo el último commit
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - name: Bandit (código inseguro en los servicios)
        run: uv run bandit -c pyproject.toml -r services
      - name: pip-audit (vulnerabilidades conocidas en las versiones de uv.lock)
        run: |
          uv export --locked --no-dev --all-packages --no-emit-workspace --format requirements-txt -o requisitos.txt
          uv run pip-audit --strict --disable-pip -r requisitos.txt
      - name: gitleaks (secretos en el historial)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PostgreSQL real como servicio: GitHub lo arranca y espera su healthcheck antes de los pasos.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages
      # Todas las pruebas (unitarias, de integración y de contrato) con cobertura mínima del 90 %.
      - run: uv run pytest --cov --cov-fail-under=90 --cov-report=term --cov-report=json
        env:
          HYPOTHESIS_PROFILE: ci
      # CRAP por función (complejidad cruzada con cobertura): ninguna llega a 10.
      - name: CRAP
        run: uv run python tools/crap.py coverage.json --limit 10

  docker:
    needs: [calidad, seguridad, integracion]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Valores de ejemplo: la base de datos solo existe durante esta ejecución.
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      # Por el gateway: /health es del gateway y /auth/health llega al servicio de autenticación.
      - run: curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/health
      - run: curl --fail http://localhost:8000/auth/health
      # Swagger (activo en desarrollo) debe funcionar detrás del gateway, con el prefijo /auth.
      - run: curl --fail http://localhost:8000/auth/openapi.json
      # Flujo de cuenta de punta a punta: gateway → servicio → PostgreSQL.
      - name: Registro, inicio de sesión, renovación y cierre de sesión
        run: |
          api=http://localhost:8000/auth
          json="Content-Type: application/json"
          curl --fail -X POST "$api/register" -H "$json" \
            -d '{"email": "ci@example.com", "password": "contraseña de prueba de CI", "first_name": "Prueba", "last_name": "de CI"}' \
            | jq -e '.first_name == "Prueba" and .last_name == "de CI"'
          tokens=$(curl --fail -X POST "$api/sessions" -H "$json" \
            -d '{"email": "ci@example.com", "password": "contraseña de prueba de CI", "device_id": "ci", "device_name": "CI"}')
          refresh=$(echo "$tokens" | jq -r .refresh_token)
          renewed=$(curl --fail -X POST "$api/sessions/refresh" -H "$json" -d "{\"refresh_token\": \"$refresh\"}")
          access=$(echo "$renewed" | jq -r .access_token)
          curl --fail -X DELETE "$api/sessions/current" -H "Authorization: Bearer $access"
      - name: Perfil y lista de dispositivos
        run: |
          api=http://localhost:8000/auth
          json="Content-Type: application/json"
          body='{"email": "perfil@example.com", "password": "contraseña de prueba de CI"'
          curl --fail -X POST "$api/register" -H "$json" \
            -d "$body, \"first_name\": \"Luis Miguel\", \"last_name\": \"Aguilar García\"}"
          phone=$(curl --fail -X POST "$api/sessions" -H "$json" \
            -d "$body, \"device_id\": \"telefono\", \"device_name\": \"Teléfono\"}" | jq -r .access_token)
          tablet=$(curl --fail -X POST "$api/sessions" -H "$json" \
            -d "$body, \"device_id\": \"tableta\", \"device_name\": \"Tableta\"}")
          curl --fail -X PATCH "$api/me" -H "$json" -H "Authorization: Bearer $phone" \
            -d '{"first_name": "Luis 🙂"}' \
            | jq -e '.first_name == "Luis 🙂" and .last_name == "Aguilar García"'
          curl --fail "$api/sessions" -H "Authorization: Bearer $phone" | jq -e 'length == 2'
          tablet_id=$(echo "$tablet" | jq -r .session_id)
          curl --fail -X DELETE "$api/sessions/$tablet_id" -H "Authorization: Bearer $phone"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$api/me" \
            -H "Authorization: Bearer $(echo "$tablet" | jq -r .access_token)")
          test "$code" = "401"
          # Sin apellido, el registro se rechaza.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$api/register" -H "$json" \
            -d '{"email": "sin.apellido@example.com", "password": "contraseña de prueba de CI", "first_name": "Ana"}')
          test "$code" = "422"
      - name: Eliminar la cuenta
        run: |
          api=http://localhost:8000/auth
          json="Content-Type: application/json"
          body='{"email": "borrar@example.com", "password": "contraseña de prueba de CI"'
          curl --fail -X POST "$api/register" -H "$json" \
            -d "$body, \"first_name\": \"Borrar\", \"last_name\": \"Cuenta\"}"
          access=$(curl --fail -X POST "$api/sessions" -H "$json" \
            -d "$body, \"device_id\": \"ci\", \"device_name\": \"CI\"}" | jq -r .access_token)
          # Contraseña incorrecta → 403 y la cuenta sigue.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$api/me" -H "$json" \
            -H "Authorization: Bearer $access" -d '{"password": "otra contraseña de CI"}')
          test "$code" = "403"
          curl --fail -X DELETE "$api/me" -H "$json" -H "Authorization: Bearer $access" \
            -d '{"password": "contraseña de prueba de CI"}'
          # La sesión quedó cerrada y la cuenta ya no inicia sesión.
          code=$(curl -s -o /dev/null -w "%{http_code}" "$api/me" -H "Authorization: Bearer $access")
          test "$code" = "401"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$api/sessions" -H "$json" \
            -d "$body, \"device_id\": \"ci\", \"device_name\": \"CI\"}")
          test "$code" = "401"
          # El correo queda libre para una cuenta nueva.
          curl --fail -X POST "$api/register" -H "$json" \
            -d "$body, \"first_name\": \"Nueva\", \"last_name\": \"Cuenta\"}"
      # /finance/* solo pasa con una sesión activa: el gateway la verifica con auth en cada petición.
      - name: Finanzas solo con sesión activa
        run: |
          api=http://localhost:8000
          json="Content-Type: application/json"
          status() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          body='{"email": "finanzas@example.com", "password": "contraseña de prueba de CI"'
          curl --fail -X POST "$api/auth/register" -H "$json" \
            -d "$body, \"first_name\": \"Finanzas\", \"last_name\": \"de CI\"}"
          access=$(curl --fail -X POST "$api/auth/sessions" -H "$json" \
            -d "$body, \"device_id\": \"ci\", \"device_name\": \"CI\"}" | jq -r .access_token)
          # Sin token, con un token inventado o con una cabecera de usuario falsa: 401.
          test "$(status "$api/finance/health")" = "401"
          test "$(status "$api/finance/health" -H "Authorization: Bearer inventado")" = "401"
          test "$(status "$api/finance/health" -H "X-User-Id: 00000000-0000-0000-0000-000000000001")" = "401"
          # Con sesión activa pasa.
          curl --fail "$api/finance/health" -H "Authorization: Bearer $access" | jq -e '.status == "ok"'
          # Swagger de finanzas (solo en desarrollo) funciona sin token, con el prefijo /finance.
          curl --fail "$api/finance/openapi.json" | jq -e '.info.title'
          curl --fail "$api/finance/docs" | grep -q "/finance/openapi.json"
          # La verificación es solo interna: desde fuera no existe.
          test "$(status "$api/auth/verify" -H "Authorization: Bearer $access")" = "404"
          # Al cerrar la sesión, finanzas deja de responder a ese token.
          curl --fail -X DELETE "$api/auth/sessions/current" -H "Authorization: Bearer $access"
          test "$(status "$api/finance/health" -H "Authorization: Bearer $access")" = "401"
      # El gateway rechaza cuerpos de más de 1 MB.
      - name: Cuerpo demasiado grande → 413
        run: |
          head -c 2000000 /dev/zero | tr '\0' 'a' > grande.json
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/auth/register \
            -H "Content-Type: application/json" --data-binary @grande.json)
          test "$code" = "413"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
