# Dependabot abre PRs que actualizan uv.lock, las acciones de CI y la imagen base.
# Cada PR pasa por CI (incluida la revisión de seguridad) antes de que Luis lo fusione.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencias:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/auth"
    schedule:
      interval: "weekly"
    ignore:
      # Python se queda en 3.12 (decisión del proyecto); solo se aceptan parches de la imagen.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Imágenes de docker-compose.yml (PostgreSQL y Caddy).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Cambiar de versión mayor de PostgreSQL exige migrar los datos: se hace a mano, con plan.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
